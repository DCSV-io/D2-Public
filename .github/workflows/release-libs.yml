#
# Release libraries: publishes the packages a release tag's
# release-manifest.json lists, in its order, then creates the GitHub Release.
#
# It runs on a push of a tag named libs/<YYYYMMDD>T<HHMMSS>Z, or on a manual
# run whose ref is such a tag; every job fails its first step on any other ref.
#
#   pack            installs from pnpm-lock.yaml with scripts off, builds,
#                   packs D2.Public.slnx and each npm package the manifest
#                   lists, checks one file per manifest entry, and uploads the
#                   package files as the artifact packages-<tag, / as ->.
#   publish         takes .github/scripts/release-publish.mjs and
#                   release-manifest.json from the run's commit, checks the id
#                   and version inside each downloaded file, and publishes each
#                   version the registry does not list. It stops at the first
#                   failure; a re-run publishes only the versions still
#                   missing from the registry.
#   github-release  creates the GitHub Release for the tag, or leaves an
#                   existing one as it is.
#
# Both registries authenticate with trusted publishing (OIDC); no step reads a
# registry key stored in the repository. Settings this workflow needs:
#   - the environment publish, limited to libs/* tags;
#   - the repository variable NUGET_USER, the nuget.org profile name of the
#     account whose trusted publishing policy lists this workflow;
#   - a trusted publisher on each npm package, set to this workflow and the
#     environment publish.
#
# A package the registry has never published can need its first version
# published by hand; the publish command of release-publish.mjs then prints
# the procedure in the publish job's log.

name: Release libraries

on:
  push:
    tags: ["libs/*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-libs
  cancel-in-progress: false

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check the ref is a release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/libs/[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "::error::This workflow runs only on a tag libs/<YYYYMMDD>T<HHMMSS>Z, not ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build D2.Public.slnx -c Release -p:ContinuousIntegrationBuild=true
          pnpm -r --filter "./packages/typescript/**" build
          pnpm --filter @dcsv-io/d2-messaging-rabbitmq test -- tests/pack-patched.test.ts

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/packages"
          mkdir -p "${out}/nuget" "${out}/npm"
          dotnet pack D2.Public.slnx -c Release --no-build \
            -p:ContinuousIntegrationBuild=true -o "${out}/nuget"
          # The npm ids come from the validated manifest.
          node --input-type=module -e '
            const script = await import("./.github/scripts/release-publish.mjs");
            for (const entry of script.readManifest("release-manifest.json")) {
              if (entry.ecosystem === "npm") console.log(entry.id);
            }
          ' > "${RUNNER_TEMP}/npm-ids.txt"
          while IFS= read -r id; do
            if [ "${id}" = "@dcsv-io/d2-messaging-rabbitmq" ]; then
              pnpm --filter "${id}" run pack:patched -- "${out}/npm"
            else
              pnpm --filter "${id}" pack --pack-destination "${out}/npm"
            fi
          done < "${RUNNER_TEMP}/npm-ids.txt"

      - name: Check one file per manifest entry
        run: >
          node .github/scripts/release-publish.mjs check
          --manifest release-manifest.json
          --nuget "${RUNNER_TEMP}/packages/nuget"
          --npm "${RUNNER_TEMP}/packages/npm"

      - name: Name the artifact
        id: artifact
        shell: bash
        run: echo "name=packages-${GITHUB_REF_NAME//\//-}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

  publish:
    name: Publish
    needs: pack
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 90
    steps:
      - name: Check the ref is a release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/libs/[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "::error::This workflow runs only on a tag libs/<YYYYMMDD>T<HHMMSS>Z, not ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/release-publish.mjs
            release-manifest.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.pack.outputs.artifact }}
          path: ${{ runner.temp }}/packages

      # No registry-url: it writes an .npmrc that expects a token in the
      # environment, and npm authenticates with trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install npm 11.21.0
        run: npm install -g npm@11.21.0 --ignore-scripts

      # The SDK major of global.json, for dotnet nuget push.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Find the ecosystems the manifest lists
        id: ecosystems
        run: node .github/scripts/release-publish.mjs ecosystems --manifest release-manifest.json

      - name: Get a NuGet key from trusted publishing
        id: nuget-login
        if: ${{ steps.ecosystems.outputs.nuget == 'true' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish the manifest packages
        env:
          NUGET_PUSH_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          node .github/scripts/release-publish.mjs publish
          --manifest release-manifest.json
          --nuget "${RUNNER_TEMP}/packages/nuget"
          --npm "${RUNNER_TEMP}/packages/npm"

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Check the ref is a release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/libs/[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "::error::This workflow runs only on a tag libs/<YYYYMMDD>T<HHMMSS>Z, not ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/release-publish.mjs
            release-manifest.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "The release ${TAG} exists; it is left as it is."
            exit 0
          fi
          node .github/scripts/release-publish.mjs notes \
            --manifest release-manifest.json --tag "${TAG}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
