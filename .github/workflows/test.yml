#
# CI for this repository (D2 open libraries).
# Paths are relative to the repository root (packages/..., contracts/...).

name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  public-build:
    name: Public build (D2.Public.slnx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build D2.Public.slnx --configuration Release

  dotnet-shared-unit-tests:
    name: .NET Shared Unit Tests
    runs-on: ubuntu-latest
    needs: [public-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: >
          dotnet test packages/dotnet/tests/DcsvIo.D2.Tests.csproj
          --configuration Release
          -- --filter-namespace "DcsvIo.D2.Tests.Unit*"

  dotnet-shared-integration-tests:
    name: .NET Shared Integration Tests
    runs-on: ubuntu-latest
    needs: [public-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: >
          dotnet test packages/dotnet/tests/DcsvIo.D2.Tests.csproj
          --configuration Release
          -- --filter-namespace "DcsvIo.D2.Tests.Integration*"

  contract-fixtures:
    name: Contract fixture emission (.NET -> fixtures)
    runs-on: ubuntu-latest
    needs: [public-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: >
          dotnet test packages/dotnet/tests/DcsvIo.D2.Tests.csproj
          --configuration Release
          -- --filter-trait "Category=ContractFixtures"

  ts-shared-unit-tests:
    name: TS Shared Unit Tests
    runs-on: ubuntu-latest
    env:
      # Public-clone mode: skip the optional parity jobs whose inputs are absent.
      PUBLIC_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      # The code generator is not part of this repository. Packages skip the
      # prebuild regeneration when it is absent and build from the committed
      # *.g.ts files.
      - run: pnpm install --fail-if-no-match --filter "./packages/typescript/**..."
      - run: pnpm --fail-if-no-match --filter "./packages/typescript/**" -r build
      - run: pnpm --fail-if-no-match --filter "./packages/typescript/**" -r test

  pack-smoke:
    name: Pack smoke (.NET nupkg + TS tgz)
    runs-on: ubuntu-latest
    needs: [public-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: Pack sample .NET consumable
        run: >
          dotnet pack packages/dotnet/result/core/DcsvIo.D2.Result.csproj
          --configuration Release --output /tmp/pack-smoke
      # Install the subtree, build the workspace dependencies first (`^...`),
      # then the package itself. Building only @dcsv-io/d2-result leaves
      # @dcsv-io/d2-error-category and its siblings unbuilt, which fails with
      # TS2307 on public CI.
      - name: pnpm install (@dcsv-io/d2-result subtree)
        run: pnpm install --fail-if-no-match --filter "@dcsv-io/d2-result..."
      - name: build @dcsv-io/d2-result workspace dependencies
        run: pnpm --fail-if-no-match --filter "@dcsv-io/d2-result^..." build
      - name: build @dcsv-io/d2-result
        run: pnpm --fail-if-no-match --filter "@dcsv-io/d2-result" build
      - name: pnpm pack @dcsv-io/d2-result
        run: pnpm --fail-if-no-match --filter "@dcsv-io/d2-result" pack --pack-destination /tmp/pack-smoke
      - name: Assert pack artifacts exist
        run: |
          set -euo pipefail
          ls /tmp/pack-smoke/DcsvIo.D2.Result.*.nupkg
          ls /tmp/pack-smoke/dcsv-io-d2-result-*.tgz

  messaging-pack-smoke:
    name: Messaging packed consumer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install messaging package and dependencies
        run: pnpm install --ignore-scripts --filter "@dcsv-io/d2-messaging-rabbitmq..."
      - name: Build messaging package closure
        run: pnpm --filter "@dcsv-io/d2-messaging-rabbitmq..." -r --no-bail build
      - name: Verify actual D2 archive and clean consumer
        run: pnpm --filter @dcsv-io/d2-messaging-rabbitmq test -- tests/pack-patched.test.ts

  proto-checks:
    name: Proto checks (buf lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.65.0"
      - run: buf lint contracts/protos
        working-directory: .
      - run: buf format --diff --exit-code contracts/protos
