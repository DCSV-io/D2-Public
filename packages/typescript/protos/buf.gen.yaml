# Buf generation config for the @dcsv-io/d2-protos TS package.
# The generated output is committed to git, so a first build needs no separate
# generation step.

version: v2
plugins:
  - local: ["pnpm", "exec", "protoc-gen-ts_proto"]
    out: src/generated
    opt:
      - esModuleInterop=true
      - outputServices=grpc-js
      - useExactTypes=false
      - oneof=unions
      - useOptionals=messages
